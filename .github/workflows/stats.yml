name: Estadísticas del perfil

on:
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    name: Regenerar tarjetas de lenguajes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generar tarjetas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.profile_stats --user "${{ github.repository_owner }}" --out-dir assets
      - name: Guardar si cambiaron los datos
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios en las tarjetas."
            exit 0
          fi
          git config user.name "Diego Francisco Granda Zhingre"
          git config user.email "148287776+DiegoFranciscoG@users.noreply.github.com"
          git add assets/languages-*.svg
          git commit -m "chore(stats): update language cards"
          git push
